# Vendor facets — Wix. A website builder that turns every site into an MCP server at
# /_api/mcp and auto-generates an llms.txt. Both are Wix's, not the site owner's: the MCP tool set
# is identical on every site (and calls wixapis.com), so it grades `platform`; the llms.txt is
# derived until the owner edits it. 0.22.0's release notes counted 62 Wix sites among the 292
# providers holding full mcp_server credit for other people's engineering.
vendor: wix
name: Wix
website: https://www.wix.com
areas:
- hosting
registry_keys:
- wix
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Every Wix site answers MCP at /_api/mcp and serves an auto-generated llms.txt, with no setup. The MCP
  server is the same seven-tool Wix template on every site, calling Wix's APIs, so it grades `platform`
  (0.25 of mcp_server); the generated llms.txt counts as derived (0.25). A site owner who edits the llms.txt
  makes it their own and earns full credit for that work. Wix's developer MCP manages Wix itself and earns
  a site nothing.
features:
- id: site-mcp
  name: Built-in Wix Site MCP
  description: >-
    Every Wix site serves an unauthenticated MCP server at <site>/_api/mcp with the same Wix-defined tools
    (SearchInSite, GetBusinessDetails, SearchSiteApiDocs, CallWixSiteAPI, GenerateVisitorToken, docs readers).
  source: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
  tier: all
- id: llms-txt-auto
  name: Auto-generated, editable llms.txt
  description: >-
    Wix generates and maintains /llms.txt from public site content; editing it in the dashboard stops
    automatic updates, and it needs a custom domain and indexing enabled.
  source: https://support.wix.com/en/article/understanding-your-sites-llmstxt-file
  tier: paid
- id: wix-dev-mcp
  name: Wix MCP for developers
  description: Wix's hosted MCP for building on Wix — searching Wix docs, writing Wix code, calling Wix
    APIs.
  source: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
  tier: all
maps:
- feature: site-mcp
  check: mcp_server
  layer: agent_readiness
  grade: platform
  note: >-
    One Wix template on every site, its CallWixSiteAPI tool pointing at wixapis.com. 0.22.0 grades it
    `platform` (0.25); 0.23.0 marks /_api/mcp platform-generated only on hosts fingerprinted as Wix (all/0-working/platform-hosts.json).
  points: 12
  baseline_pass_rate: 0.22
- feature: llms-txt-auto
  check: llms_txt_published
  layer: composite
  credit: 0.25
  note: >-
    Wix-generated from the site's pages — derived (0.25). An owner-edited file is the owner's own at 1.0,
    and that credit belongs to the owner's writing, not to Wix.
  provider_must: Upgrade, connect a custom domain and allow indexing; edit the file to earn full credit.
  catalog_pass_rate: 0.351
  facet: discoverability
  points: 4
  baseline_pass_rate: 0.65
earns_nothing:
- feature: wix-dev-mcp
  check: mcp_server
  why: The developer MCP is Wix's own server for working on Wix; it is not the site owner's surface.
out_of_reach:
  checks:
  - well_known_published
  - well_known_catalog
